<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoRate — Pricing Calculator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue-deep: #0a0e27;
      --blue-mid: #0d1b4b;
      --blue-accent: #1a6cf6;
      --blue-bright: #3b8dff;
      --blue-glow: #4fa3ff;
      --blue-light: #93c5fd;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-shine: rgba(255, 255, 255, 0.22);
      --text-primary: #f0f6ff;
      --text-secondary: rgba(180, 210, 255, 0.75);
      --text-muted: rgba(130, 170, 220, 0.55);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--blue-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background orbs */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(26, 108, 246, 0.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(59, 141, 255, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(10, 40, 100, 0.5) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26, 108, 246, 0.15) 0%, transparent 70%);
      top: -200px;
      right: -150px;
      pointer-events: none;
      z-index: 0;
      animation: drift 12s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-60px, 80px) scale(1.1); }
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
    }

    /* Header */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1a6cf6 0%, #0a3fa8 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.15),
        0 8px 32px rgba(26, 108, 246, 0.5),
        inset 0 1px 0 rgba(255,255,255,0.25);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .brand-icon::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
      border-radius: 16px 16px 0 0;
    }

    .brand-icon svg {
      width: 26px;
      height: 26px;
      fill: white;
      position: relative;
      z-index: 1;
    }

    .brand h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--blue-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .brand p {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Glass card */
    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        0 1px 0 var(--glass-shine) inset,
        0 32px 64px rgba(0, 10, 40, 0.6),
        0 0 0 1px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    /* Glossy top shine */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 60%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.04) 0%, transparent 100%);
      pointer-events: none;
      border-radius: 24px 24px 0 0;
    }

    /* Input fields */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-prefix {
      position: absolute;
      left: 16px;
      font-size: 16px;
      font-weight: 500;
      color: var(--blue-glow);
      pointer-events: none;
      z-index: 1;
    }

    .input-suffix {
      position: absolute;
      right: 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      pointer-events: none;
    }

    input[type="number"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      padding: 14px 50px 14px 36px;
      outline: none;
      transition: all 0.2s ease;
      -moz-appearance: textfield;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 2px 8px rgba(0,0,0,0.2);
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    input[type="number"]::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    input[type="number"]:focus {
      border-color: rgba(26, 108, 246, 0.6);
      background: rgba(26, 108, 246, 0.08);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 2px 8px rgba(0,0,0,0.2),
        0 0 0 3px rgba(26, 108, 246, 0.2),
        0 0 24px rgba(26, 108, 246, 0.15);
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1) 30%, rgba(255,255,255,0.1) 70%, transparent);
      margin-bottom: 28px;
    }

    /* Result display */
    .result {
      background: linear-gradient(135deg, rgba(26, 108, 246, 0.15) 0%, rgba(10, 60, 160, 0.1) 100%);
      border: 1px solid rgba(26, 108, 246, 0.3);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
    }

    .result::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59, 141, 255, 0.6), transparent);
    }

    .result-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue-light);
      margin-bottom: 8px;
      opacity: 0.8;
    }

    .result-value {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--blue-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      transition: all 0.3s ease;
    }

    .result-value.empty {
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0;
      opacity: 0.3;
    }

    .result-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.3s ease 0.1s;
    }

    .result-sub.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Rating badge */
    .rate-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 12px;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.3s ease 0.2s;
    }

    .rate-badge.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .rate-badge.great {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .rate-badge.good {
      background: rgba(59, 141, 255, 0.15);
      border: 1px solid rgba(59, 141, 255, 0.3);
      color: #93c5fd;
    }

    .rate-badge.low {
      background: rgba(251, 146, 60, 0.15);
      border: 1px solid rgba(251, 146, 60, 0.3);
      color: #fdba74;
    }

    .rate-badge.very-low {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.35s ease 0.15s;
    }

    .stats-row.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .stat-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Glow pulse on result update */
    @keyframes resultGlow {
      0% { box-shadow: 0 0 0 0 rgba(26, 108, 246, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(26, 108, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(26, 108, 246, 0); }
    }

    .result.glow {
      animation: resultGlow 0.6s ease-out;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <h1>VideoRate</h1>
      <p>Know your worth as a video editor</p>
    </div>

    <div class="card">
      <div class="field-group">
        <div class="field">
          <label>Project Payment</label>
          <div class="input-wrap">
            <span class="input-prefix">$</span>
            <input
              type="number"
              id="payment"
              placeholder="0.00"
              min="0"
              step="0.01"
              inputmode="decimal"
            />
          </div>
        </div>

        <div class="field">
          <label>Hours Worked</label>
          <div class="input-wrap">
            <span class="input-prefix" style="font-size:14px;">⏱</span>
            <input
              type="number"
              id="hours"
              placeholder="0"
              min="0"
              step="0.5"
              inputmode="decimal"
            />
            <span class="input-suffix">hrs</span>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="result" id="result">
        <div class="result-label">Your Hourly Rate</div>
        <div class="result-value empty" id="result-value">—</div>
        <div class="result-sub" id="result-sub"></div>
        <div class="rate-badge" id="rate-badge"></div>
      </div>

      <div class="stats-row" id="stats-row">
        <div class="stat-card">
          <div class="stat-label">Daily Rate (8h)</div>
          <div class="stat-value" id="stat-daily">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Monthly Est. (20d)</div>
          <div class="stat-value" id="stat-monthly">—</div>
        </div>
      </div>
    </div>

    <div class="footer">
      Built for video editors who know their craft
    </div>
  </div>

  <script>
    const paymentInput = document.getElementById('payment');
    const hoursInput = document.getElementById('hours');
    const resultValue = document.getElementById('result-value');
    const resultSub = document.getElementById('result-sub');
    const rateBadge = document.getElementById('rate-badge');
    const statsRow = document.getElementById('stats-row');
    const statDaily = document.getElementById('stat-daily');
    const statMonthly = document.getElementById('stat-monthly');
    const resultEl = document.getElementById('result');

    function formatCurrency(val) {
      if (val >= 1000) {
        return '$' + (val / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
      }
      return '$' + val.toFixed(2).replace(/\.00$/, '');
    }

    function getRating(rate) {
      if (rate >= 100) return { cls: 'great', icon: '🚀', label: 'Excellent rate' };
      if (rate >= 60)  return { cls: 'good',  icon: '✦', label: 'Solid rate' };
      if (rate >= 30)  return { cls: 'low',   icon: '▲', label: 'Consider raising rates' };
      return                  { cls: 'very-low', icon: '↑', label: 'Below industry average' };
    }

    function calculate() {
      const payment = parseFloat(paymentInput.value);
      const hours = parseFloat(hoursInput.value);

      if (!isNaN(payment) && !isNaN(hours) && hours > 0 && payment >= 0) {
        const rate = payment / hours;

        // Update main result
        resultValue.classList.remove('empty');
        resultValue.textContent = formatCurrency(rate) + '/hr';

        // Sub label
        resultSub.textContent = `$${payment.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})} ÷ ${hours}h`;
        resultSub.classList.add('visible');

        // Rating badge
        const { cls, icon, label } = getRating(rate);
        rateBadge.className = 'rate-badge ' + cls + ' visible';
        rateBadge.textContent = icon + ' ' + label;

        // Stats
        const daily = rate * 8;
        const monthly = daily * 20;
        statDaily.textContent = formatCurrency(daily);
        statMonthly.textContent = formatCurrency(monthly);
        statsRow.classList.add('visible');

        // Glow pulse
        resultEl.classList.remove('glow');
        void resultEl.offsetWidth;
        resultEl.classList.add('glow');

      } else {
        resultValue.classList.add('empty');
        resultValue.textContent = '—';
        resultSub.classList.remove('visible');
        rateBadge.className = 'rate-badge';
        statsRow.classList.remove('visible');
      }
    }

    paymentInput.addEventListener('input', calculate);
    hoursInput.addEventListener('input', calculate);
  </script>
</body>
</html>
